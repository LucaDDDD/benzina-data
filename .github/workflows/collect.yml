name: Raccolta prezzi MIMIT

on:
  schedule:
    # Il MIMIT pubblica l'estrazione al mattino (ora italiana), a volte in ritardo:
    # due passaggi al giorno, lo script è idempotente per data di estrazione.
    - cron: "45 6 * * *"   # ~08:45 italiane (estate)
    - cron: "0 12 * * *"   # ripasso a metà giornata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scarica e archivia i CSV del giorno
        run: python3 scripts/fetch.py

      - name: Commit dei nuovi dati
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo, niente commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Dati MIMIT $(date -u +%F)"
            git push
          fi
